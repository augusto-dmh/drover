version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/pgdriver/queries.sql"
    schema:
      - "internal/migrate/migrations"
      - "internal/pgdriver/sqlc_schema.sql"
    gen:
      go:
        package: "dbsqlc"
        out: "internal/dbsqlc"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
