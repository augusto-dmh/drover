version: "2"

linters:
  default: standard
  enable:
    - copyloopvar
    - errname
    - errorlint
    - gosec
    - misspell
    - sloglint
    - tparallel
  exclusions:
    rules:
      # sqlc-generated code is not hand-maintained.
      - path: internal/dbsqlc/
        linters:
          - all

formatters:
  enable:
    - gofmt
    - goimports
